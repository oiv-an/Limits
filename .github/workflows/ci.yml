name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    # Swift tools 6.0 requires Xcode 16, available on the macOS 15 runner.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test --disable-sandbox
      - name: Build application
        run: ./scripts/build.sh
      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: Limits-macOS
          path: dist/Limits.app
          if-no-files-found: error
