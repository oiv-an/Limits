name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    # Swift tools 6.0 requires Xcode 16, available on the macOS 15 runner.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test --disable-sandbox
      - name: Build universal installer
        run: ./scripts/package-release.sh
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Limits-macOS-installer
          path: |
            release/*.dmg
            release/*.sha256
          if-no-files-found: error
